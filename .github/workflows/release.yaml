name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build time-picker-card.js
        run: |
          npm ci
          npm run build
      - name: Upload to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/time-picker-card.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
